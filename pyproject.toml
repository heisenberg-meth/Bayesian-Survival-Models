[tool.poetry]
name = "bayesian-survival-models"
version = "0.1.0"
description = "Bayesian Cox Proportional Hazards and Deep Survival Models"
authors = ["Research Team <research@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
numpy = "*"
pandas = "*"
scipy = "*"
matplotlib = "*"
seaborn = "*"
plotly = "*"
scikit-learn = "*"
scikit-survival = "*"
lifelines = "*"
pymc = "*"
arviz = "*"
torch = "*"
torchvision = "*"
torchaudio = "*"
torchtuples = "*"
pycox = "*"
shap = "*"
pyyaml = "*"
hydra-core = "*"
omegaconf = "*"
rich = "*"
tqdm = "*"
joblib = "*"
jupyterlab = "*"
ipykernel = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
black = "*"
ruff = "*"
mypy = "*"
pre-commit = "*"
isort = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
