# Model Hyperparameters and Defaults
# These are the canonical source of truth for all model scripts.
# CLI arguments override these values when explicitly passed.

cox_ph:
  # Matches CoxPHModel.__init__(l2_reg=) — L2 ridge penalty on coefficients
  l2_reg: 0.0001

random_survival_forest:
  n_estimators: 100
  min_samples_split: 10
  min_samples_leaf: 5
  max_depth: 8
  max_features: "sqrt"
  bootstrap: true
  random_state: 42

deepsurv:
  hidden_dims: [64, 32]
  dropout: 0.2
  activation: "relu"
  batch_norm: true
  learning_rate: 0.001
  l2_reg: 0.001
  max_iter: 300

bayesian_cox:
  beta_prior_mean: 0.0
  # Prior width for regression coefficients — sigma parameter passed to Normal/StudentT/Laplace
  beta_prior_sd: 10.0
  baseline_prior: "gamma"
  coefficient_prior: "normal"
  n_intervals: 6
  mcmc:
    draws: 2000
    tune: 1000
    chains: 4
    target_accept: 0.95
  advi:
    n_iterations: 10000
